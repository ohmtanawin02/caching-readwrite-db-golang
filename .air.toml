#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/app/main.go"
  entrypoint = ["./tmp/main"]
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "docs"]
  exclude_regex = ["_test.go"]
  include_ext = ["go"]
  log = "build-errors.log"
  stop_on_error = false
  send_interrupt = true
  kill_delay = "1s"

[color]
  build = "yellow"
  runner = "green"
  watcher = "cyan"
  main = "magenta"

[log]
  time = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true
