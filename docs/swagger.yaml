        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.JSONResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.JSONResponse'
      security:
      - BearerAuth: []
      summary: List suppliers
      tags:
      - suppliers
    post:
      consumes:
      - application/json
      parameters:
      - description: Supplier data
        in: body
        name: body
        required: true
